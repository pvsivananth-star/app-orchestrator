# ============================================================
# app-orchestrator
# AI Provider / Agent Configuration
#
# Strategy:
#   Primary: Ollama (local)
#   Fallback: Cloud providers (Groq, Gemini, DeepSeek, OpenRouter)
# ============================================================

providers:

  # ----------------------------------------------------------
  # Ollama (Local)
  # ----------------------------------------------------------

  ollama:
    name: ollama
    model: deepseek-coder:1.3b #codellama:7b
    env_vars: []
    timeout: 120
    max_retries: 3
    retry_delay: 2.0

  # ----------------------------------------------------------
  # Cloud Providers
  # ----------------------------------------------------------

  groq:
    name: groq
    model: llama-3.3-70b-versatile
    env_vars: [GROQ_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  gemini:
    name: gemini
    model: gemini-3.5-flash
    env_vars: [GEMINI_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  deepseek:
    name: deepseek
    model: deepseek-chat
    env_vars: [DEEPSEEK_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  openrouter:
    name: openrouter
    model: openai/gpt-3.5-turbo
    env_vars: [OPENROUTER_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0


# ============================================================
# AGENTS
#
# Ollama first, then cloud fallback
# ============================================================

agents:

  interaction:
    - ollama
    - groq
    - gemini
    - deepseek
    - openrouter
    - FAIL

  requirement_enhancer:
