providers:
  gemini:
    name: gemini
    model: gemini-3.5-flash-lite
    fallback_models:
      - gemini-3.5-flash-lite
      - gemini-3.1-flash-lite
      - gemini-3.6-flash
      - gemini-3.5-flash
    rate_limit_interval: 6.0
    env_vars: [GEMINI_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  deepseek:
    name: deepseek
    model: deepseek-chat
    env_vars: [DEEPSEEK_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  groq:
    name: groq
    model: mixtral-8x7b-32768
    env_vars: [GROQ_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  openrouter:
    name: openrouter
    model: openai/gpt-3.5-turbo
    env_vars: [OPENROUTER_API_KEY]
    timeout: 30
    max_retries: 5
    retry_delay: 1.0

  huggingface:
    name: huggingface
    model: meta-llama/Llama-2-70b-chat-hf
    env_vars: [HUGGINGFACE_API_KEY]
    timeout: 60
    max_retries: 5
    retry_delay: 2.0

agents:
  interaction:
    - deepseek
    - groq
    - openrouter
    - FAIL
  requirement_enhancer:
    - deepseek
    - groq
    - openrouter
    - FAIL
  business_analyst:
    - deepseek
    - groq
    - openrouter
    - FAIL
  repo_analyst:
    - gemini
    - deepseek
    - groq
    - FAIL
  dependency:
    - huggingface
    - deepseek
    - groq
    - FAIL
  implementation:
    - deepseek
    - groq
    - openrouter
    - FAIL
  verification:
    - groq
    - deepseek
    - openrouter
    - FAIL
  security:
    - deepseek
    - groq
    - openrouter
    - FAIL
  lint:
    - groq
    - deepseek
    - openrouter
    - FAIL
  test:
    - deepseek
    - groq
    - openrouter
    - FAIL
  doc:
    - gemini
    - deepseek
    - groq
    - FAIL
  commit:
    - openrouter
    - deepseek
    - groq
    - FAIL
